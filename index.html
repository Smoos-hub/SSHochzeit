<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Steven &amp; Svenja — Wir heiraten</title>
<meta name="description" content="Wir heiraten am 11. Dezember 2026 — begleitet uns an unserem großen Tag.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app" id="app">

  <!-- Countdown-Leiste, auf jeder Seite sichtbar -->
  <div class="countdown-bar" id="countdown-bar">
    <span>Noch</span>
    <span class="countdown-bar__num" id="cd-days">00</span><span>Tage</span>
    <span class="countdown-bar__sep">&middot;</span>
    <span class="countdown-bar__num" id="cd-hours">00</span><span>:</span><span class="countdown-bar__num" id="cd-minutes">00</span><span>:</span><span class="countdown-bar__num" id="cd-seconds">00</span>
    <span>bis zur Hochzeit</span>
  </div>

  <!-- Die einzelnen Seiten werden von js/script.js hier eingefügt -->
  <div class="book" id="book"></div>

  <!-- Blätter-Navigation -->
  <nav class="book-nav">
    <button class="book-nav__arrow book-nav__arrow--prev" id="nav-prev" aria-label="Vorherige Seite">
      <svg viewBox="0 0 24 24"><path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="book-nav__counter" id="nav-counter">1 / 1</span>
    <button class="book-nav__arrow book-nav__arrow--next" id="nav-next" aria-label="Nächste Seite">
      <svg viewBox="0 0 24 24"><path d="M9 4 L17 12 L9 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </nav>
</div>

<!-- Lightbox für Fotos -->
<div class="lightbox" id="lightbox">
  <button class="lightbox__close" id="lightbox-close" aria-label="Schließen">&times;</button>
  <img src="" alt="" id="lightbox-img">
</div>

<!-- ===========================================================
     SEITEN-VORLAGEN
     Diese <template>-Blöcke werden von js/script.js in der
     richtigen Reihenfolge als Buchseiten zusammengesetzt.
     Hier kannst du Texte, Namen, Ort und Ablauf anpassen.
     =========================================================== -->

<template id="tpl-hero">
  <div class="page page--hero">
    <div class="hero-ornament" aria-hidden="true">
      <svg viewBox="0 0 200 200">
        <path d="M100 20 C 60 40, 40 80, 100 100 C 160 80, 140 40, 100 20 Z" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="100" cy="100" r="60" fill="none" stroke="currentColor" stroke-width="0.6"/>
        <path d="M40 100 Q 100 60 160 100 Q 100 140 40 100 Z" fill="none" stroke="currentColor" stroke-width="0.6"/>
      </svg>
    </div>
    <div class="page__inner">
      <p class="hero__eyebrow">Einladung zur Hochzeit</p>
      <h1 class="hero__names">Steven <span class="hero__amp">&amp;</span> Svenja</h1>
      <p class="hero__date">11. Dezember 2026 &middot; Musterstadt</p>
    </div>
    <p class="hero__hint">Zum Weiterblättern die Pfeile nutzen oder wischen</p>
  </div>
</template>

<template id="tpl-story">
  <div class="page page--story">
    <div class="page__inner">
      <p class="section-label">Ein paar Worte</p>
      <h2 class="story__heading">Wir sagen Ja</h2>
      <p class="story__text">
        Nach [X] gemeinsamen Jahren ist es soweit — wir geben uns das Jawort
        und möchten diesen Tag mit den Menschen feiern, die uns am wichtigsten
        sind. Wir freuen uns riesig, ihn mit euch zu teilen.
      </p>
    </div>
  </div>
</template>

<template id="tpl-future">
  <div class="page page--future">
    <div class="page__inner page__inner--future">
      <h2 class="story__heading">Unsere gemeinsame Zukunft</h2>
      <div class="future-photos"></div>
    </div>
  </div>
</template>

<template id="tpl-schedule">
  <div class="page page--schedule">
    <div class="page__inner page__inner--future">
      <p class="section-label">Der Ablauf</p>
      <div class="schedule-wrap">
        <ul class="schedule">
          <li class="schedule__item">
            <span class="schedule__time">14:00</span>
            <span class="schedule__label">Trauung</span>
          </li>
          <li class="schedule__item">
            <span class="schedule__time">15:00</span>
            <span class="schedule__label">Sektempfang</span>
          </li>
          <li class="schedule__item">
            <span class="schedule__time">18:00</span>
            <span class="schedule__label">Abendessen</span>
          </li>
          <li class="schedule__item">
            <span class="schedule__time">21:00</span>
            <span class="schedule__label">Party</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</template>

<template id="tpl-footer">
  <div class="page page--footer">
    <div class="page__inner">
      <p class="section-label">Wo wir feiern</p>
      <h2 class="story__heading">Schloss Lindenhof</h2>
      <p class="details__address">
        Lindenhofweg 4<br>
        12345 Musterstadt
      </p>
      <a href="https://maps.google.com/?q=Schloss+Lindenhof+Musterstadt" target="_blank" rel="noopener" class="details__map-link">
        Route planen
      </a>
      <p class="footer__note">Wir freuen uns auf euch.</p>
      <p class="footer__names">Steven &amp; Svenja</p>
    </div>
  </div>
</template>

<script src="js/script.js"></script>
</body>
</html>
